name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Frontend ────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Create frontend .env
        run: |
          cat > .env <<'EOF'
VITE_API_URL=https://campusalumni.in/backend/api
VITE_FIREBASE_API_KEY=AIzaSyCM_MFB_oe_PSlK8xdmOxoVOZcFWNHwdYE
VITE_FIREBASE_AUTH_DOMAIN=cspp-2a134-f66d4.firebaseapp.com
VITE_FIREBASE_PROJECT_ID=cspp-2a134-f66d4
VITE_FIREBASE_STORAGE_BUCKET=cspp-2a134-f66d4.firebasestorage.app
VITE_FIREBASE_MESSAGING_SENDER_ID=80639183490
VITE_FIREBASE_APP_ID=1:80639183490:web:a70f285740abd93ca6029b
VITE_FIREBASE_MEASUREMENT_ID=G-W8BVR7ZB31
VITE_STORAGE_KEY=profile_v1
EOF

      - name: Build frontend
        run: npm run build

      - name: Deploy frontend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.campusalumni.in
          username: u763367215.campusalumni.in
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install backend dependencies
        run: composer install --no-dev --optimize-autoloader
        working-directory: ./backend

      - name: Create backend .env
        run: |
          cat > backend/.env <<'ENVEOF'
APP_NAME="Campus School Pantnagar Alumni Portal"
APP_URL=https://campusalumni.in
APP_ENV=production
FRONTEND_URL=https://campusalumni.in
DB_HOST=localhost
DB_PORT=3306
DB_NAME=u763367215_campusschool
DB_USER=u763367215_campusschool
DB_PASS=Campus@2026@
JWT_SECRET=cspp_alumni_campusalumni_2024_xK9mP2qRvL8nT5wZ
JWT_EXPIRY=3600
JWT_REFRESH_EXPIRY=604800
UPLOAD_MAX_SIZE=10485760
UPLOAD_PATH=uploads/
RATE_LIMIT_REQUESTS=60
RATE_LIMIT_WINDOW=60
ENVEOF

      - name: Deploy backend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.campusalumni.in
          username: u763367215.campusalumni.in
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: /public_html/backend/
          exclude: |
            **/.git_disabled/**
            **/database/**
          dangerous-clean-slate: false
