name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Create frontend .env
        run: |
          echo "VITE_API_URL=https://campusalumni.in/backend/api" > .env
          echo "VITE_FIREBASE_API_KEY=AIzaSyCM_MFB_oe_PSlK8xdmOxoVOZcFWNHwdYE" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=cspp-2a134-f66d4.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=cspp-2a134-f66d4" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=cspp-2a134-f66d4.firebasestorage.app" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=80639183490" >> .env
          echo "VITE_FIREBASE_APP_ID=1:80639183490:web:a70f285740abd93ca6029b" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=G-W8BVR7ZB31" >> .env
          echo "VITE_SUPABASE_URL=https://divvkonzeukafawgwzzu.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON_KEY=sb_publishable_ag5ejpRyT9NYYgTrkIOSew_bFmzosYQ" >> .env
          echo "VITE_STORAGE_KEY=profile_v1" >> .env
          cat .env

      - name: Build frontend
        run: npm run build

      - name: Deploy frontend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.campusalumni.in
          username: u763367215.campusschool
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install backend dependencies
        run: composer install --no-dev --optimize-autoloader
        working-directory: ./backend

      - name: Create backend .env
        run: |
          echo 'APP_NAME="Campus School Pantnagar Alumni Portal"' > backend/.env
          echo "APP_URL=https://campusalumni.in" >> backend/.env
          echo "APP_ENV=production" >> backend/.env
          echo "FRONTEND_URL=https://campusalumni.in" >> backend/.env
          echo "DB_HOST=localhost" >> backend/.env
          echo "DB_PORT=3306" >> backend/.env
          echo "DB_NAME=u763367215_campusschool" >> backend/.env
          echo "DB_USER=u763367215_campusschool" >> backend/.env
          echo "DB_PASS=Campus@2026@" >> backend/.env
          echo "JWT_SECRET=cspp_alumni_campusalumni_2024_xK9mP2qRvL8nT5wZ" >> backend/.env
          echo "JWT_EXPIRY=3600" >> backend/.env
          echo "JWT_REFRESH_EXPIRY=604800" >> backend/.env
          echo "UPLOAD_MAX_SIZE=10485760" >> backend/.env
          echo "UPLOAD_PATH=uploads/" >> backend/.env
          echo "RATE_LIMIT_REQUESTS=60" >> backend/.env
          echo "RATE_LIMIT_WINDOW=60" >> backend/.env

      - name: Deploy backend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.campusalumni.in
          username: u763367215.campusschool
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: /public_html/backend/
          exclude: |
            **/.git_disabled/**
            **/database/**
          dangerous-clean-slate: false
