name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create frontend .env
        run: |
          echo "VITE_API_URL=https://campusalumni.in/backend/api" >> .env
          echo "VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=cspp-2a134-f66d4.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=cspp-2a134-f66d4" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=cspp-2a134-f66d4.firebasestorage.app" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=80639183490" >> .env
          echo "VITE_FIREBASE_APP_ID=1:80639183490:web:a70f285740abd93ca6029b" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=G-W8BVR7ZB31" >> .env
          echo "VITE_STORAGE_KEY=profile_v1" >> .env

      - name: Build frontend
        run: npm run build

      - name: Deploy frontend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.campusalumni.in
          username: u763367215.campusalumni.in
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install backend dependencies
        run: composer install --no-dev --optimize-autoloader
        working-directory: ./backend

      - name: Create backend .env
        run: |
          cat > backend/.env <<'ENVEOF'
APP_NAME="Campus School Pantnagar Alumni Portal"
APP_URL=https://campusalumni.in
APP_ENV=production
FRONTEND_URL=https://campusalumni.in
DB_HOST=localhost
DB_PORT=3306
DB_NAME=u763367215_campusschool
DB_USER=u763367215_campusschool
DB_PASS=${{ secrets.DB_PASS }}
JWT_SECRET=${{ secrets.JWT_SECRET }}
JWT_EXPIRY=3600
JWT_REFRESH_EXPIRY=604800
UPLOAD_MAX_SIZE=10485760
UPLOAD_PATH=uploads/
RATE_LIMIT_REQUESTS=60
RATE_LIMIT_WINDOW=60
ENVEOF

      - name: Deploy backend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.campusalumni.in
          username: u763367215.campusalumni.in
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: /public_html/backend/
          exclude: |
            **/.git_disabled/**
            **/database/**
          dangerous-clean-slate: false
