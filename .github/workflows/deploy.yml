name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "VITE_API_URL=https://csp-backend-production.railway.app/api" >> .env
          echo "VITE_FIREBASE_API_KEY=AIzaSyAJnEk9kRnQnt-mmgKh9t0XOgKSRZWVTOA" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=cspp-2a134.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=cspp-2a134" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=cspp-2a134.firebasestorage.app" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=871663305723" >> .env
          echo "VITE_FIREBASE_APP_ID=1:871663305723:web:a5747e0027015938d8015e" >> .env
          echo "VITE_STORAGE_KEY=profile_v1" >> .env

      - name: Build
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.campusalumni.in
          username: u763367215
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
