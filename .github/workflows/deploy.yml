name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          printf '%s\n' \
            'VITE_API_URL=https://campusalumni.in/backend/api' \
            'VITE_FIREBASE_API_KEY=AIzaSyCM_MFB_oe_PSlK8xdmOxoVOZcFWNHwdYE' \
            'VITE_FIREBASE_AUTH_DOMAIN=cspp-2a134-f66d4.firebaseapp.com' \
            'VITE_FIREBASE_PROJECT_ID=cspp-2a134-f66d4' \
            'VITE_FIREBASE_STORAGE_BUCKET=cspp-2a134-f66d4.firebasestorage.app' \
            'VITE_FIREBASE_MESSAGING_SENDER_ID=80639183490' \
            'VITE_FIREBASE_APP_ID=1:80639183490:web:a70f285740abd93ca6029b' \
            'VITE_FIREBASE_MEASUREMENT_ID=G-W8BVR7ZB31' \
            'VITE_SUPABASE_URL=https://divvkonzeukafawgwzzu.supabase.co' \
            'VITE_SUPABASE_ANON_KEY=sb_publishable_ag5ejpRyT9NYYgTrkIOSew_bFmzosYQ' \
            'VITE_STORAGE_KEY=profile_v1' \
            > .env
          echo "--- .env contents ---"
          cat .env

      - name: Build
        run: npm run build

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.campusalumni.in
          username: u763367215.campusschool
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
